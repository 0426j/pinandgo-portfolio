<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>변경 한 건의 처리와 되돌리기</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<text x="20" y="28" font-size="13.5" font-weight="700" fill="#94a3b8" text-anchor="start">변경 한 건(예: 자리 변경)은 서버 함수 하나가 한 트랜잭션으로 처리</text>
<rect x="20" y="50" width="170" height="84" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.6"/>
<text x="105.0" y="81.0" font-size="15" font-weight="700" fill="#dbeafe" text-anchor="middle">화면</text>
<text x="105.0" y="99.0" font-size="12.5" fill="#dbeafe" fill-opacity="0.85" text-anchor="middle">도착 자리 바코드 스캔</text>
<text x="105.0" y="115.5" font-size="12.5" fill="#dbeafe" fill-opacity="0.85" text-anchor="middle">확인 버튼</text>
<rect x="225" y="50" width="180" height="84" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
<text x="315.0" y="81.5" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">① 소속 매장 판별</text>
<text x="315.0" y="99.5" font-size="12" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">_my_store()</text>
<text x="315.0" y="115.5" font-size="12" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">로그인 정보에서 스스로 찾음</text>
<rect x="430" y="50" width="190" height="84" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
<text x="525.0" y="81.0" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">② 규칙 검사</text>
<text x="525.0" y="99.0" font-size="12.5" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">이미 옮겨짐 · 없는 로케</text>
<text x="525.0" y="115.5" font-size="12.5" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">이미 그 자리에 있음</text>
<rect x="655" y="50" width="190" height="84" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
<text x="750.0" y="81.0" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">③ 한 트랜잭션</text>
<text x="750.0" y="99.0" font-size="12.5" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">상품-자리 표 변경</text>
<text x="750.0" y="115.5" font-size="12.5" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">+ movements 한 줄</text>
<rect x="880" y="50" width="140" height="84" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="1.6"/>
<text x="950.0" y="81.0" font-size="15" font-weight="700" fill="#dcfce7" text-anchor="middle">응답</text>
<text x="950.0" y="99.0" font-size="12.5" fill="#dcfce7" fill-opacity="0.85" text-anchor="middle">성공 또는</text>
<text x="950.0" y="115.5" font-size="12.5" fill="#dcfce7" fill-opacity="0.85" text-anchor="middle">거부 코드</text>
<path d="M190,92 L225,92" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M405,92 L430,92" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M620,92 L655,92" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="638" y="84" font-size="12" fill="#94a3b8" text-anchor="middle" stroke="#0d1117" stroke-width="4" paint-order="stroke" stroke-linejoin="round">통과</text>
<path d="M845,92 L880,92" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="430" y="190" width="190" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.6"/>
<text x="525.0" y="217.5" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">거부</text>
<text x="525.0" y="235.5" font-size="12" fill="#fee2e2" fill-opacity="0.85" text-anchor="middle">한글 안내 · 아무것도 안 바뀜</text>
<path d="M525,134 L525,190" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="535" y="166" font-size="12" fill="#94a3b8" text-anchor="start" stroke="#0d1117" stroke-width="4" paint-order="stroke" stroke-linejoin="round">위반</text>
<text x="20" y="296" font-size="13.5" font-weight="700" fill="#94a3b8" text-anchor="start">되돌리기 두 갈래</text>
<rect x="20" y="316" width="190" height="76" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.6"/>
<text x="115.0" y="343.5" font-size="15" font-weight="700" fill="#dbeafe" text-anchor="middle">직전 작업 [취소]</text>
<text x="115.0" y="361.5" font-size="12" fill="#dbeafe" fill-opacity="0.85" text-anchor="middle">작업 직후 화면 위에 표시</text>
<text x="115.0" y="377.5" font-size="12" fill="#dbeafe" fill-opacity="0.85" text-anchor="middle">비밀번호 없음</text>
<path d="M950,134 L950,270 L115,270 L115,316" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="720" y="262" font-size="12" fill="#94a3b8" text-anchor="middle" stroke="#0d1117" stroke-width="4" paint-order="stroke" stroke-linejoin="round">작업 직후</text>
<rect x="250" y="316" width="230" height="76" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
<text x="365.0" y="343.5" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">undo_movement</text>
<text x="365.0" y="361.5" font-size="12" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">10분 안 · 그 상품의 가장 최근 이력</text>
<text x="365.0" y="377.5" font-size="12" fill="#e0e7ff" fill-opacity="0.85" text-anchor="middle">원래 동작을 되돌림</text>
<path d="M210,354 L250,354" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="520" y="316" width="230" height="76" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="1.6"/>
<text x="635.0" y="343.5" font-size="15" font-weight="700" fill="#dcfce7" text-anchor="middle">새 이력 rollback 추가</text>
<text x="635.0" y="361.5" font-size="12" fill="#dcfce7" fill-opacity="0.85" text-anchor="middle">rollback_of = 원본 이력 번호</text>
<text x="635.0" y="377.5" font-size="12" fill="#dcfce7" fill-opacity="0.85" text-anchor="middle">원본 이력은 그대로 남음</text>
<path d="M480,354 L520,354" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="790" y="316" width="230" height="76" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="1.6"/>
<text x="905.0" y="343.5" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">관리자: 이력 선택 롤백</text>
<text x="905.0" y="361.5" font-size="12" fill="#fef3c7" fill-opacity="0.85" text-anchor="middle">rollback_movement</text>
<text x="905.0" y="377.5" font-size="12" fill="#fef3c7" fill-opacity="0.85" text-anchor="middle">관리자 비밀번호 확인</text>
<path d="M790,354 L750,354" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="770" y="346" font-size="12" fill="#94a3b8" text-anchor="middle" stroke="#0d1117" stroke-width="4" paint-order="stroke" stroke-linejoin="round">통과</text>
<rect x="790" y="430" width="230" height="60" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.6"/>
<text x="905.0" y="457.5" font-size="15" font-weight="700" fill="#fee2e2" text-anchor="middle">충돌이면 거부</text>
<text x="905.0" y="475.5" font-size="12" fill="#fee2e2" fill-opacity="0.85" text-anchor="middle">그 뒤 다른 변경이 있음</text>
<path d="M905,392 L905,430" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="20" y="440" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">영구삭제도 이력에 남아 되돌릴 수 있음(바코드·등록일시로 상품을 다시 만듦)</text>
</svg>