<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>데이터 구조</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect x="20" y="20" width="200" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="120.0" y="47.0" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">store_members</text>
<text x="120.0" y="65.0" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">로그인 계정 ↔ 매장</text>
<text x="120.0" y="81.5" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">한 계정은 한 매장</text>
<rect x="240" y="20" width="200" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="340.0" y="47.0" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">admin_secret</text>
<text x="340.0" y="65.0" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">관리자 비밀번호 해시</text>
<text x="340.0" y="81.5" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">매장당 한 벌 · 백업 제외</text>
<rect x="480" y="20" width="200" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="580.0" y="47.0" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">stores</text>
<text x="580.0" y="65.0" font-size="12.5" fill="#1e293b" fill-opacity="0.85" text-anchor="middle">매장 번호 · 이름 · 상태</text>
<text x="580.0" y="81.5" font-size="12.5" fill="#1e293b" fill-opacity="0.85" text-anchor="middle">is_template: 새 매장의 출발점</text>
<rect x="700" y="20" width="160" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="780.0" y="47.0" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">settings</text>
<text x="780.0" y="65.0" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">key_rule · 도면 바닥</text>
<text x="780.0" y="81.5" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">휴지통 알림 등</text>
<rect x="880" y="20" width="140" height="76" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="950.0" y="47.0" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">usage_events</text>
<text x="950.0" y="65.0" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">조회 기록</text>
<text x="950.0" y="81.5" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">서버 함수로만</text>
<text x="170" y="118" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">모든 데이터 표는 store_id를 가짐 · RLS는 로그인 계정의 매장 행만 허용</text>
<path d="M580,96 L580,128" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<line x1="160" y1="128" x2="825" y2="128" stroke="#64748b" stroke-width="1.5"/>
<path d="M160,128 L160,170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M450,128 L450,170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M825,128 L825,170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="40" y="170" width="240" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="160.0" y="210.8" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">zones</text>
<text x="160.0" y="228.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">구역 글자 · 가로 칸 수 · 단 수</text>
<text x="160.0" y="245.2" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">1번 칸 방향(start_corner)</text>
<text x="160.0" y="261.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">map_plan: 도면 줄 배치(jsonb)</text>
<rect x="330" y="170" width="240" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="450.0" y="210.8" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">locations</text>
<text x="450.0" y="228.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">code 예 A3-2 · 구역 · 가로 · 세로</text>
<text x="450.0" y="245.2" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">종류: 일반 / 특수(박스 등)</text>
<text x="450.0" y="261.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">휴지통 X0-0은 매장마다 하나</text>
<rect x="700" y="170" width="250" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="825.0" y="210.8" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">products</text>
<text x="825.0" y="228.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">barcode: 키 규칙으로 뽑은 키</text>
<text x="825.0" y="245.2" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">full_barcode: 마지막으로 찍은 풀코드</text>
<text x="825.0" y="261.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">수량·입력 컬럼 없음</text>
<path d="M280,230 L330,230" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="305" y="222" font-size="12" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1:N</text>
<rect x="480" y="340" width="300" height="96" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="630.0" y="368.8" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">product_locations</text>
<text x="630.0" y="386.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">(상품, 로케) 한 줄 = 그 자리에 있음</text>
<text x="630.0" y="403.2" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">휴지통 = X0-0 행(상태 컬럼 없음)</text>
<text x="630.0" y="419.8" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">한 상품이 여러 자리에 가능</text>
<path d="M450,290 L450,315 L560,315 L560,340" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="500" y="308" font-size="12" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1:N</text>
<path d="M780,290 L780,315 L700,315 L700,340" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="742" y="308" font-size="12" fill="#64748b" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1:N</text>
<rect x="810" y="340" width="210" height="96" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="915.0" y="377.0" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">product_variants</text>
<text x="915.0" y="395.0" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">찍힌 풀코드 전체 한 줄씩</text>
<text x="915.0" y="411.5" font-size="12.5" fill="#312e81" fill-opacity="0.85" text-anchor="middle">처음·마지막 시각 · 횟수</text>
<path d="M915,290 L915,340" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="925" y="318" font-size="12" fill="#64748b" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1:N</text>
<rect x="20" y="340" width="420" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="230.0" y="372.5" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">movements (이력)</text>
<text x="230.0" y="390.5" font-size="12.5" fill="#14532d" fill-opacity="0.85" text-anchor="middle">action: 등록 · 이동 · 복사 · 삭제 · 복구 · 롤백 · 영구삭제</text>
<text x="230.0" y="407.0" font-size="12.5" fill="#14532d" fill-opacity="0.85" text-anchor="middle">from → to · 기기 라벨 · rollback_of(원본 이력 번호)</text>
<text x="230.0" y="423.5" font-size="12.5" fill="#14532d" fill-opacity="0.85" text-anchor="middle">추가만 하고 수정·삭제 없음</text>
<text x="230.0" y="440.0" font-size="12.5" fill="#14532d" fill-opacity="0.85" text-anchor="middle">상품 외래키 없음 → 영구삭제 뒤에도 이력이 남음</text>
<text x="20" y="500" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">데이터와 로그인 계정은 연결하지 않음: 소유자 컬럼·외래키가 없어 계정을 바꿔도 데이터는 그대로</text>
</svg>